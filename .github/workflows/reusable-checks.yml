name: Linting and Formatting Checks

on:
  workflow_call:
    inputs:
      path:
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'

      - name: Check formatting
        working-directory: ${{ inputs.path }}
        run: |
          # Generated files (mocks, gqlgen) are excluded.
          unformatted=$(gofmt -l . | xargs -r grep -L '^// Code generated .* DO NOT EDIT\.' || true)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run Go vet
        working-directory: ${{ inputs.path }}
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: ${{ inputs.path }}
          # Existing code has pre-existing findings; only flag new ones.
          only-new-issues: true

      - name: Run tests
        working-directory: ${{ inputs.path }}
        run: go test ./...
