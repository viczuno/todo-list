name: Linting and Formatting Checks

on:
  workflow_call:
    inputs:
      path:
        required: true
        type: string

jobs:
  lint-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'

      - name: Run Go fmt
        run: |
          cd ${{ inputs.path }}
          go fmt ./...

      - name: Run Go vet
        run: |
          cd ${{ inputs.path }}
          go vet ./...
